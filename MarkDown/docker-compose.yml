version: '3.9'

services:
  webapi:
    image: ${DOCKER_REGISTRY-}webapi
    build:
      context: .
      dockerfile: WebAPI/Dockerfile
    ports:
      - "8080:80"
    env-file:
      - ".env"
    environment:
        POSTGRES_DB: ${DATABASE}
        POSTGRES_USER: ${USER}
        POSTGRES_PASSWORD: ${PASSWORD}
        POSTGRES_HOST: ${HOST}
        JwtOption_SECRETKEY: ${SECRETKEY}
        JwtOption_EXPIRESHOURS: ${EXPIRESHOURS}

  db:
    image: postgres:17
    ports:
       - "5433:5433"
    env_file:
       - ".env"
    environment:
       POSTGRES_DB: ${DATABASE}
       POSTGRES_PASSWORD: ${PASSWORD}
       POSTGRES_USER: ${USER}

      